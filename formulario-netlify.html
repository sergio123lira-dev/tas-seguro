<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulário</title></head>
<body>
<!-- Cópia simples do formulário de cotação, para o Netlify reconhecer. Não apague. -->
<form name="cotacao" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="cotacao">
  <input name="bot-field">
  <input name="tipo"><input name="nome"><input name="tel"><input name="email">
  <input name="modelo"><input name="ano"><input name="placa"><input name="uso">
  <input name="fipe"><input name="cep"><input name="idade"><input name="enviado_em">
</form>
</body></html>
